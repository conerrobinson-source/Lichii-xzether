# Builds the Lichii Android app (arm64 APK) on every push and on demand.
name: android

on:
  push:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 3G
      # The s26-ultra branch compiles for Snapdragon Oryon CPUs (8 Elite, 8 Elite Gen 5) and keeps
      # its own ccache, since its objects never match the generic build's.
      BUILD_PRESET: ${{ github.ref == 'refs/heads/s26-ultra' && 'oryon' || 'custom' }}
      CCACHE_KEY_PREFIX: ${{ github.ref == 'refs/heads/s26-ultra' && 'android-oryon-ccache-' || 'android-ccache-' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2* /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ccache glslang-tools ninja-build

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ env.CCACHE_KEY_PREFIX }}${{ github.sha }}
          restore-keys: ${{ env.CCACHE_KEY_PREFIX }}

      - name: Restore CPM downloads
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/cpm
          key: android-cpm-${{ hashFiles('cpmfile.json', 'externals/cpmfile.json', 'src/**/cpmfile.json') }}
          restore-keys: android-cpm-

      - name: Build APK
        env:
          CCACHE: "true"
          CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
        run: |
          chmod +x .ci/android/build.sh
          .ci/android/build.sh -t standard -b Release -DYUZU_BUILD_PRESET="$BUILD_PRESET"

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lichii-android-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Read release version
        if: startsWith(github.ref, 'refs/tags/android-') && github.ref != 'refs/tags/android-latest'
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#android-}" >> "$GITHUB_ENV"

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/android-') && github.ref != 'refs/tags/android-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lichii for Android ${{ env.RELEASE_VERSION }}
          prerelease: false
          make_latest: true
          body_path: docs/android/RELEASE_NOTES.md
          files: artifacts/*.apk

      - name: Publish test release for phone download
        if: github.ref == 'refs/heads/nx2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Lichii Android test build
          prerelease: true
          make_latest: false
          body: Automatic test build from ${{ github.sha }}. Experimental.
          files: artifacts/*.apk

      - name: Publish Galaxy S26 Ultra build for phone download
        if: github.ref == 'refs/heads/s26-ultra'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-s26-latest
          target_commitish: ${{ github.sha }}
          name: Lichii Android S26 Ultra build
          prerelease: true
          make_latest: false
          body: >-
            Build from ${{ github.sha }} compiled for Snapdragon Oryon CPUs (Galaxy S25 and S26 Ultra).
            Other phones may not run it. Experimental.
          files: artifacts/*.apk
